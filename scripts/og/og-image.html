<!doctype html>
<!--
  Source for client/public/og-image.png (1200×630), the link-preview image.
  Re-render after editing:  npm run og   (uses headless Edge/Chrome, see scripts/og/render.mjs)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0d1829;
        color: #fff;
        font-family: "Inter", "Segoe UI", sans-serif;
        position: relative;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(100, 216, 198, 0.16) 1px, transparent 1px);
        background-size: 22px 22px;
        mask-image: linear-gradient(to right, #000 30%, transparent 95%);
      }
      .frame {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 560px 1fr;
        gap: 40px;
        align-items: center;
        padding: 0 64px;
        border-bottom: 6px solid #0e7c6b;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #64d8c6;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-bottom: 26px;
      }
      .eyebrow::before { content: ""; width: 30px; height: 3px; background: #64d8c6; }
      h1 {
        font-size: 84px;
        line-height: 0.98;
        font-weight: 800;
        letter-spacing: -0.04em;
        margin-bottom: 26px;
      }
      h1 span { color: #64d8c6; }
      .lead { font-size: 23px; line-height: 1.45; color: #c7d2de; margin-bottom: 30px; max-width: 30em; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 34px; }
      .chip {
        font-family: "JetBrains Mono", monospace;
        font-size: 14.5px;
        padding: 5px 9px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #c7d2de;
      }
      .url { font-family: "JetBrains Mono", monospace; font-size: 19px; color: #8a9bb0; }
      .url b { color: #fff; font-weight: 500; }
      svg { width: 100%; height: auto; display: block; }
      svg text { font-family: "JetBrains Mono", monospace; }
      .box { fill: rgba(255, 255, 255, 0.03); stroke: rgba(199, 210, 222, 0.3); }
      .ext { fill: none; stroke-dasharray: 3 3; }
      .hi { fill: rgba(100, 216, 198, 0.06); stroke: rgba(100, 216, 198, 0.6); }
      .bound { fill: none; stroke: rgba(199, 210, 222, 0.18); stroke-dasharray: 6 5; }
      .chipr { fill: rgba(255, 255, 255, 0.05); stroke: rgba(199, 210, 222, 0.16); }
      .t { font-size: 12.5px; fill: #d5deea; }
      .s { font-family: "Inter", sans-serif !important; font-weight: 600; font-size: 13.5px; fill: #fff; }
      .l { font-size: 10.5px; fill: #8a9bb0; }
      .c { font-size: 10.5px; fill: #c7d2de; }
      .e { stroke: rgba(199, 210, 222, 0.55); stroke-width: 1.2; }
      .eh { stroke: #64d8c6; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .et { font-size: 10.5px; fill: #8a9bb0; }
      .eht { font-size: 10.5px; fill: #64d8c6; }
    </style>
  </head>
  <body>
    <div class="frame">
      <div>
        <p class="eyebrow">Back-End Developer</p>
        <h1>Mohammad<br />Yousefi<span>.</span></h1>
        <p class="lead">Modular Django back-ends, clean REST APIs, and the queues that keep them fast.</p>
        <div class="chips">
          <span class="chip">Python</span><span class="chip">Django</span><span class="chip">DRF</span>
          <span class="chip">PostgreSQL</span><span class="chip">Celery</span><span class="chip">Redis</span>
          <span class="chip">Docker</span>
        </div>
        <p class="url"><b>mohammadyr.github.io</b> · Tehran</p>
      </div>

      <!-- same drawing as client/src/components/ArchitectureDiagram.tsx -->
      <svg viewBox="0 0 520 392" aria-hidden="true">
        <defs>
          <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L8,4 L0,8 z" fill="rgba(199,210,222,0.7)" />
          </marker>
          <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L8,4 L0,8 z" fill="#64d8c6" />
          </marker>
        </defs>
        <rect class="box ext" x="30" y="16" width="280" height="44" />
        <text class="t" x="170" y="43" text-anchor="middle">Client · buyer / seller</text>
        <rect class="box ext" x="370" y="16" width="120" height="44" />
        <text class="t" x="430" y="43" text-anchor="middle">SMS · Email</text>
        <rect class="bound" x="12" y="88" width="496" height="292" />
        <text class="l" x="24" y="376">docker compose</text>

        <rect class="box" x="30" y="108" width="280" height="164" />
        <text class="l" x="46" y="130">web · :8000</text>
        <text class="s" x="46" y="150">Django 5 + DRF</text>
        <rect class="chipr" x="46" y="164" width="80" height="22" /><text class="c" x="86" y="179" text-anchor="middle">accounts</text>
        <rect class="chipr" x="130" y="164" width="80" height="22" /><text class="c" x="170" y="179" text-anchor="middle">catalog</text>
        <rect class="chipr" x="214" y="164" width="80" height="22" /><text class="c" x="254" y="179" text-anchor="middle">marketplace</text>
        <rect class="chipr" x="46" y="194" width="80" height="22" /><text class="c" x="86" y="209" text-anchor="middle">sales</text>
        <rect class="chipr" x="130" y="194" width="80" height="22" /><text class="c" x="170" y="209" text-anchor="middle">payments</text>
        <rect class="chipr" x="214" y="194" width="80" height="22" /><text class="c" x="254" y="209" text-anchor="middle">reviews</text>
        <rect class="chipr" x="46" y="228" width="248" height="26" style="fill:none;stroke-dasharray:2 3" />
        <text class="c" x="170" y="245" text-anchor="middle">core · soft-delete base models</text>

        <rect class="box" x="30" y="300" width="280" height="52" />
        <text class="l" x="46" y="321">db</text>
        <text class="s" x="46" y="340">PostgreSQL 15</text>

        <rect class="box hi" x="370" y="108" width="120" height="52" />
        <text class="l" x="382" y="129">celery</text>
        <text class="s" x="382" y="148">worker</text>
        <rect class="box hi" x="370" y="196" width="120" height="52" />
        <text class="l" x="382" y="217">redis</text>
        <text class="s" x="382" y="236">Redis 7 · broker</text>
        <rect class="box" x="370" y="300" width="120" height="52" />
        <text class="l" x="382" y="321">celery-beat</text>
        <text class="s" x="382" y="340">scheduler</text>

        <line class="e" x1="170" y1="60" x2="170" y2="106" marker-end="url(#a)" />
        <text class="et" x="178" y="80">HTTPS · JWT</text>
        <line class="e" x1="170" y1="272" x2="170" y2="298" marker-end="url(#a)" />
        <text class="et" x="178" y="290">ORM</text>
        <line class="e" x1="430" y1="300" x2="430" y2="250" marker-end="url(#a)" />
        <text class="et" x="438" y="280">schedules</text>

        <line class="eh" x1="310" y1="222" x2="368" y2="222" marker-end="url(#ah)" />
        <text class="eht" x="339" y="214" text-anchor="middle">enqueue</text>
        <line class="eh" x1="430" y1="196" x2="430" y2="162" marker-end="url(#ah)" />
        <text class="eht" x="438" y="183">consume</text>
        <line class="eh" x1="430" y1="108" x2="430" y2="62" marker-end="url(#ah)" />
        <text class="eht" x="438" y="90">send</text>
      </svg>
    </div>
  </body>
</html>
