<!doctype html>
<!--
  Source for client/public/og-image.png (1200×630), the link-preview image.
  Mirrors the home hero: name, tagline and the "MY" stack mark (client/src/components/StackMark.tsx).
  Re-render after editing:  npm run og
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #f6f3ec;
        color: #102019;
        font-family: "Inter", "Segoe UI", sans-serif;
        position: relative;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(12, 75, 51, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(12, 75, 51, 0.07) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse at 78% 50%, #000 0%, transparent 65%);
      }
      .frame {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 460px;
        gap: 48px;
        align-items: center;
        padding: 0 72px;
        border-bottom: 10px solid #0c4b33;
      }
      h1 {
        font-size: 96px;
        line-height: 0.96;
        font-weight: 800;
        letter-spacing: -0.045em;
        margin-bottom: 22px;
      }
      h1 span { color: #0c4b33; }
      .tagline {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: 40px;
        line-height: 1.2;
        color: #0c4b33;
        margin-bottom: 40px;
      }
      .url {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        color: #5f6b64;
      }
      .url b { color: #102019; font-weight: 400; }
      svg { width: 100%; height: auto; display: block; }
    </style>
  </head>
  <body>
    <div class="frame">
      <div>
        <h1>Mohammad<br />Yousefi<span>.</span></h1>
        <p class="tagline">Back-end developer —<br />Python &amp; Django</p>
        <p class="url"><b>mohammadyr.github.io</b> · Tehran</p>
      </div>

      <svg viewBox="0 0 440 240" aria-hidden="true">
        <g fill="#0c4b33">
          <rect x="2.5" y="42.5" width="35" height="195" />
          <rect x="82.5" y="42.5" width="35" height="115" />
          <rect x="162.5" y="42.5" width="35" height="195" />
          <rect x="242.5" y="2.5" width="35" height="75" />
          <rect x="402.5" y="2.5" width="35" height="75" />
          <rect x="242.5" y="82.5" width="195" height="35" />
          <rect x="322.5" y="122.5" width="35" height="115" />
        </g>
        <rect x="2.5" y="2.5" width="195" height="35" fill="#f2c94c" />
      </svg>
    </div>
  </body>
</html>
